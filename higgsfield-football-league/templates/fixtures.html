<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Darul Uloom Football League — fixtures</title>
<link rel="stylesheet" href="common.css">
<style>
@page { size: A4; margin: 0; }
html, body { width: 210mm; height: 297mm; }
body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
#stage { position: relative; width: 210mm; height: 297mm; overflow: hidden; }
.page { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }
.band { background: var(--ink); color: var(--cream); border-bottom: 1.1vw solid var(--crimson); height: 9vw; display: flex; align-items: center; justify-content: space-between;
  padding: 0 6vw; font-weight: 700; letter-spacing: .4vw; text-transform: uppercase; font-size: 2.6vw; flex: none; }
.band b { color: var(--crimson-lt); font-weight: 800; }
.body { flex: 1; padding: 3.2vw 7vw 0; display: flex; flex-direction: column; }
.bism { text-align: center; color: var(--crimson); font-size: 3.6vw; line-height: 1.8; }
.l1 { text-align: center; font-weight: 800; text-transform: uppercase; letter-spacing: .9vw; color: var(--crimson); font-size: 4.2vw; line-height: 1.05; }
.l2 { text-align: center; font-weight: 800; text-transform: uppercase; letter-spacing: .2vw; font-size: 8vw; line-height: .95; }
.rule { margin: 1.6vw 0 1.4vw; }
.meta { text-align: center; font-size: 3.4vw; color: var(--ink2); letter-spacing: .1vw; }
.meta b { color: var(--ink); font-weight: 700; }

.round { margin-top: 2.6vw; }
.rh { display: flex; align-items: center; gap: 2vw; margin-bottom: 1.4vw; }
.rh .no { background: var(--crimson); color: var(--cream); font-weight: 800; font-size: 3vw; letter-spacing: .3vw; text-transform: uppercase; padding: .5vw 1.8vw; border-radius: .5vw; }
.rh .ko { font-weight: 800; font-size: 3.6vw; }
.rh .line { flex: 1; height: .25vw; background: linear-gradient(90deg, var(--crimson), transparent); }
.games { display: grid; grid-template-columns: 1fr 1fr; gap: 2.4vw; }
.game { background: var(--ink); color: var(--cream); border-radius: .7vw; border-bottom: .9vw solid var(--crimson); padding: 1.2vw 2vw 1.5vw; }
.pitch { font-size: 2.4vw; letter-spacing: .35vw; text-transform: uppercase; color: #c9bfae; text-align: center; margin-bottom: 1vw; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1vw; }
.side { display: flex; flex-direction: column; align-items: center; text-align: center; gap: .6vw; min-width: 0; }
.side svg { width: 7.4vw; }
.side .nm { font-weight: 700; font-size: 3.3vw; line-height: 1; white-space: nowrap; }
.side .ar { color: var(--crimson-lt); font-size: 2.7vw; line-height: 1.35; font-weight: 700; }
.v { font-weight: 800; font-size: 4.6vw; color: var(--crimson-lt); }

.who { margin-top: 3.2vw; }
.who h3 { font-weight: 800; text-transform: uppercase; letter-spacing: .3vw; font-size: 3vw; color: var(--crimson); margin-bottom: 1vw; }
.who table { width: 100%; border-collapse: collapse; font-size: 2.9vw; }
.who th { text-align: left; font-weight: 700; color: var(--ink2); font-size: 2.4vw; letter-spacing: .2vw; text-transform: uppercase; padding: .8vw 1vw; border-bottom: .3vw solid var(--ink); }
.who td { padding: 1vw; border-bottom: .15vw solid var(--line); white-space: nowrap; }
.who td:first-child { font-weight: 700; }
.who td svg { width: 3.6vw; vertical-align: middle; margin-right: 1vw; }
.who small { color: var(--ink2); font-size: 2.2vw; margin-left: .8vw; }
.foot { text-align: center; color: var(--ink2); font-size: 2.3vw; padding: 2vw 0 2.6vw; margin-top: auto; letter-spacing: .1vw; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="common.js"></script>
<script>
window.init = (F) => {
  applyBrand(F.brand);
  const team = (n) => teamOf(F.teams, n);
  const stage = document.getElementById('stage');
  const page = el('div', 'page'), band = el('div', 'band'), body = el('div', 'body');
  const right = el('span'); right.append('Matchweek '); right.append(el('b', null, String(F.week)));
  band.append(el('span', null, 'Fixtures'), right);
  const lines = F.title_lines?.length ? F.title_lines : [F.league];
  body.append(el('div', 'ar bism', F.brand?.bismillah || ''));
  if (lines.length > 1) body.append(el('div', 'l1', lines[0]));
  body.append(el('div', 'l2', lines.at(-1)), starRule());
  const meta = el('div', 'meta');
  meta.append(el('b', null, `Matchweek ${F.week} fixtures`));
  const bits = [F.date ? fmtDate(F.date) : null, F.venue].filter(Boolean);
  if (bits.length) meta.append(`  ·  ${bits.join('  ·  ')}`);
  body.append(meta);

  for (const r of F.rounds) {
    const box = el('div', 'round'), rh = el('div', 'rh');
    rh.append(el('span', 'no', `Round ${r.round}`));
    if (r.kickoff) rh.append(el('span', 'ko', r.kickoff));
    rh.append(el('span', 'line'));
    const games = el('div', 'games');
    for (const g of r.games) {
      const c = el('div', 'game'), vs = el('div', 'vs');
      const side = (n) => { const s = el('div', 'side'); s.append(crest(team(n)), el('div', 'nm', n), el('div', 'ar', plainAr(team(n).arabic))); return s; };
      vs.append(side(g.teams[0]), el('div', 'v', 'v'), side(g.teams[1]));
      c.append(el('div', 'pitch', g.pitch), vs);
      games.append(c);
    }
    box.append(rh, games);
    body.append(box);
  }

  // each team's own running order, for players who only care about their games
  const who = el('div', 'who'), tbl = document.createElement('table');
  who.append(el('h3', null, 'Your games'));
  const head = document.createElement('tr');
  for (const h of ['Team', ...F.rounds.map((r) => `Round ${r.round}${r.kickoff ? ` · ${r.kickoff}` : ''}`)]) head.append(el('th', null, h));
  tbl.append(head);
  for (const t of F.teams) {
    const tr = document.createElement('tr'), first = el('td');
    first.append(crest(t), document.createTextNode(disp(t.name)));
    tr.append(first);
    for (const r of F.rounds) {
      const g = r.games.find((x) => x.teams.includes(t.name));
      const td = el('td');
      if (g) { td.append(disp(g.teams.find((n) => n !== t.name))); td.append(el('small', null, g.pitch)); } else td.append('—');
      tr.append(td);
    }
    tbl.append(tr);
  }
  who.append(tbl);
  body.append(who, el('div', 'foot', 'Two games at a time · every team plays every other team once'));
  page.append(band, body);
  stage.replaceChildren(...[logoField(F.logo, F.brand?.watermark_opacity ?? .07), page].filter(Boolean));
  // always exactly one A4 page: shrink the body if a long name or extra rows would push it over
  const room = stage.clientHeight - band.offsetHeight;
  const need = body.scrollHeight;
  if (need > room) body.style.zoom = String(Math.floor((room / need) * 1000) / 1000);
  return true;
};
</script>
</body>
</html>
